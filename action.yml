name: Kerno Check
description: Replay committed Kerno scenarios against a running system under test and report them as a PR check.
author: Kerno

branding:
  icon: check-circle
  color: blue

inputs:
  mode:
    description: >-
      `replay` (default) runs the committed scenarios against sut-url and reports them as a check.
      `sync` runs nothing: on a push to the default branch it sends the committed scenarios to
      Kerno as that commit's snapshot, so the portal can track the default branch over time, and
      writes what the merge changed to the job summary. `sync` needs api-key and ignores every
      replay input.
    required: false
    default: replay
  sut-url:
    description: >-
      Base URL of your already-running system under test, e.g. http://localhost:8080. Start it in
      an earlier step — this action connects to it and never manages its lifecycle. A localhost or
      127.0.0.1 URL is rewritten to host.docker.internal, because the scenarios execute inside a
      container and a container's localhost is itself. Required in replay mode unless `apps` is
      given.
    required: false
    default: ""
  app-dir:
    description: >-
      Directory of the application whose scenarios to replay, relative to the repository root.
      Leave unset to discover every <app>/.kerno/scenarios tree in the repository, which is what a
      monorepo usually wants. Every discovered app is replayed against the same sut-url, and
      report-path is then a directory rather than a file when discovery finds more than one.
    required: false
    default: ""
  scenarios:
    description: >-
      Replay only scenarios whose path, relative to their scenarios directory, matches this glob —
      e.g. "endpoints/GET/**". `*` stays within a path segment, `**` crosses them. Leave unset to
      replay all of them.
    required: false
    default: ""
  image:
    description: >-
      The Kerno runner image. Pinned by digest so a given version of this action always runs the
      same code; override only to test an unreleased build.
    required: false
    default: kernoio/ts-sandbox@sha256:e814c076d4d7e71f92f27f9e39f78d6c71f5aeb9ea582f9ae9630b768edde425
  apps:
    description: >-
      Replay several applications, each against its own URL: one `<dir>=<url>` per line, where
      `<dir>` is the directory containing `.kerno` relative to the repository root. `.` is the
      repository root. Use this instead of sut-url when a monorepo's services listen on different
      ports. Mutually exclusive with sut-url and app-dir.
    required: false
    default: ""
  forward-env:
    description: >-
      Environment variable names to pass through to the scenarios, one per line. Values are read
      from this step's own `env:`, so secrets come from GitHub Secrets and never enter the
      repository. Only the names listed here are forwarded; the rest of the runner's environment
      is not. A name listed here with no value fails the step before the container starts, naming
      the variable — rather than letting a scenario fail deep in a database step while every HTTP
      assertion around it still passes.
    required: false
    default: ""
  report-path:
    description: >-
      JUnit XML report destination, relative to the workspace. A file when a single application was
      replayed; a DIRECTORY of one report per application when `apps` is used, or when discovery
      finds several applications. Point a reporter at `<report-path>/*.xml` to cover both.
    required: false
    default: kerno-junit.xml
  fail-on-failure:
    description: >-
      Fail the step when a scenario fails. Set to false to report without gating — the outputs
      still carry the counts. Scenarios that never executed (blocked, or not yet implemented) are
      reported as skipped and never fail the step.
    required: false
    default: "true"
  api-key:
    description: >-
      Your API key from Settings → API key in the Kerno portal. Store it as a repository secret.
      Used to open a portal run per endpoint after replay, and to send the snapshot in sync mode.
      Leave unset to keep the no-account path — no portal URL is printed, and nothing is sent to
      Kerno. A key Kerno does not accept is a warning, never a failed step.
    required: false
    default: ""
  organization-id:
    description: >-
      Optional. The organization to use, for an API key that belongs to several. Leave unset and
      the key's own organization is used. Setting it without api-key is an error.
    required: false
    default: ""
  backend-url:
    description: >-
      Kerno API base URL used to check api-key. Leave unset for production
      (https://api.kerno.io). Override for development.
    required: false
    default: ""
  events-url:
    description: >-
      Events-service base URL used to open and finish portal runs. Leave unset for production
      (https://events.kerno.io/events-service/). Override for development.
    required: false
    default: ""
  portal-url:
    description: >-
      Portal base URL used to build the run links printed in the log. Leave unset for production
      (https://portal.kerno.io). Override for development.
    required: false
    default: ""

outputs:
  junit-path:
    description: Path to the JUnit XML report.
    value: ${{ steps.replay.outputs.junit-path }}
  total:
    description: Scenarios in the report.
    value: ${{ steps.report.outputs.total }}
  passed:
    description: Scenarios that passed.
    value: ${{ steps.report.outputs.passed }}
  failed:
    description: Scenarios that failed.
    value: ${{ steps.report.outputs.failed }}
  skipped:
    description: Scenarios that never executed — blocked, or not yet implemented.
    value: ${{ steps.report.outputs.skipped }}
  portal-run-urls:
    description: >-
      Portal run URLs opened for this check, one per endpoint, separated by newlines. Empty when
      api-key was not set, or when opening a run failed. A missing URL never fails the check.
    value: ${{ steps.report.outputs.portal-run-urls }}

runs:
  using: composite
  steps:
    - name: Check mode
      shell: bash
      env:
        KERNO_MODE: ${{ inputs.mode }}
      run: |
        case "$KERNO_MODE" in
          replay|sync) ;;
          *) echo "::error::mode must be replay or sync, got: $KERNO_MODE"; exit 2 ;;
        esac

    - name: Replay Kerno scenarios
      id: replay
      if: ${{ inputs.mode == 'replay' }}
      shell: bash
      env:
        KERNO_SUT_URL: ${{ inputs.sut-url }}
        KERNO_APP_DIR: ${{ inputs.app-dir }}
        KERNO_SCENARIOS: ${{ inputs.scenarios }}
        KERNO_IMAGE: ${{ inputs.image }}
        KERNO_REPORT_PATH: ${{ inputs.report-path }}
        KERNO_APPS: ${{ inputs.apps }}
        KERNO_FORWARD_ENV: ${{ inputs.forward-env }}
      run: |
        set -euo pipefail

        # Exactly one way of naming the SUT. Silently preferring one over the other would make a
        # workflow that sets both look like it works while half its configuration is ignored.
        if [ -n "$KERNO_APPS" ] && [ -n "$KERNO_SUT_URL" ]; then
          echo "::error::set either sut-url or apps, not both — apps carries a URL per application"
          exit 2
        fi
        if [ -n "$KERNO_APPS" ] && [ -n "$KERNO_APP_DIR" ]; then
          echo "::error::app-dir replays one application; apps replays several. Set one or the other"
          exit 2
        fi
        if [ -z "$KERNO_APPS" ] && [ -z "$KERNO_SUT_URL" ]; then
          echo "::error::sut-url is required (or use apps to give each application its own URL)"
          exit 2
        fi

        # `apps` names its applications up front and has always produced a directory of reports,
        # including when only one application is listed.
        separate_apps=0
        if [ -n "$KERNO_APPS" ]; then
          separate_apps=1
        fi

        # A container's localhost is the container. Customers overwhelmingly run their SUT on the
        # runner itself, so rewrite it rather than making every first attempt fail on a connection
        # error that gives no hint why.
        rewrite_localhost() {
          printf '%s' "$1" | sed -e 's|//localhost|//host.docker.internal|' -e 's|//127\.0\.0\.1|//host.docker.internal|'
        }

        sut_url="$KERNO_SUT_URL"
        case "$sut_url" in
          *//localhost*|*//127.0.0.1*)
            sut_url=$(rewrite_localhost "$sut_url")
            echo "sut-url points at the runner; using $sut_url from inside the container"
            ;;
        esac

        # One <dir>=<url> per line. `.` and `./` are the repository root. The runner keys that
        # application as an empty relative path and stops walking there, so a list that includes
        # the root replays every line by its own scenarios directory. Any other list is passed
        # through as --app=<dir>=<url>, which the runner matches against the directory it found.
        trim() {
          local v="$1"
          v="${v#"${v%%[![:space:]]*}"}"
          printf '%s' "${v%"${v##*[![:space:]]}"}"
        }

        app_args=()
        app_dirs=()
        app_urls=()
        while IFS= read -r line; do
          line="${line%%$'\r'}"
          [ -z "${line// }" ] && continue
          dir="${line%%=*}"
          url="${line#*=}"
          dir="$(trim "$dir")"
          url="$(trim "$url")"
          if [ -z "$dir" ] || [ -z "$url" ] || [ "$dir" = "$line" ]; then
            echo "::error::apps expects one <dir>=<url> per line, got: $line"
            exit 2
          fi
          case "$dir" in
            .|./) dir="." ;;
            *) dir="${dir%/}" ;;
          esac
          if [ ! -d "$GITHUB_WORKSPACE/${dir}/.kerno/scenarios" ]; then
            echo "::error::no scenarios at ${dir}/.kerno/scenarios — check the apps input"
            exit 2
          fi
          url="$(rewrite_localhost "$url")"
          app_dirs+=("$dir")
          app_urls+=("$url")
          if [ "$dir" != "." ]; then
            app_args+=(--app="${dir}=${url}")
          fi
        done <<< "$KERNO_APPS"

        seen=$'\n'
        for dir in "${app_dirs[@]+"${app_dirs[@]}"}"; do
          case "$seen" in
            *$'\n'"$dir"$'\n'*)
              echo "::error::apps lists ${dir} more than once"
              exit 2
              ;;
          esac
          seen="${seen}${dir}"$'\n'
        done

        includes_root=0
        for dir in "${app_dirs[@]+"${app_dirs[@]}"}"; do
          if [ "$dir" = "." ]; then
            includes_root=1
          fi
        done

        # Only the names asked for, and every one of them must have a value. A name with no value
        # is the silent-partial-pass case: the scenarios run, the HTTP assertions pass, and the one
        # that needed a database fails somewhere unhelpful. Fail here instead, naming all of them.
        env_args=()
        missing=()
        invalid=()
        reserved=()
        while IFS= read -r name; do
          name="${name%%$'\r'}"
          name="$(trim "$name")"
          [ -z "$name" ] && continue

          # Checked before the indirect expansion below: `${!name}` on something that is not a
          # valid identifier aborts with a raw bash "invalid variable name" and no hint of which
          # input caused it, which is the opposite of what this input is for.
          case "$name" in
            [A-Za-z_]*) ;;
            *) invalid+=("$name"); continue ;;
          esac
          if [ -n "$(printf '%s' "$name" | tr -d 'A-Za-z0-9_')" ]; then
            invalid+=("$name")
            continue
          fi

          # Overwriting these breaks the runner container rather than configuring the tests, and
          # the resulting failure looks like a Kerno bug.
          case "$name" in
            PATH|HOME|NODE_OPTIONS|LD_PRELOAD|LD_LIBRARY_PATH)
              reserved+=("$name")
              continue
              ;;
          esac

          if [ -z "${!name+x}" ] || [ -z "${!name}" ]; then
            missing+=("$name")
            continue
          fi
          env_args+=(-e "$name=${!name}")
        done <<< "$KERNO_FORWARD_ENV"

        if [ "${#invalid[@]}" -gt 0 ]; then
          echo "::error::forward-env is a list of variable NAMES, one per line; these are not valid names: ${invalid[*]}"
          exit 2
        fi
        if [ "${#reserved[@]}" -gt 0 ]; then
          echo "::error::forward-env cannot override the runner's own environment: ${reserved[*]}. Give your tests a differently named variable"
          exit 2
        fi

        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::forward-env names ${#missing[@]} variable(s) with no value: ${missing[*]}. Set each one in this step's own env:, taking the value from a GitHub secret"
          exit 2
        fi

        # Scenarios live in the checked-out repository, mounted read-only. One directory when
        # app-dir is given, otherwise discover every .kerno/scenarios tree beneath the root.
        if [ -n "$KERNO_APP_DIR" ]; then
          scenarios_dir="${KERNO_APP_DIR%/}/.kerno/scenarios"
          if [ ! -d "$GITHUB_WORKSPACE/$scenarios_dir" ]; then
            echo "::error::no scenarios at $scenarios_dir — check the app-dir input"
            exit 2
          fi
          scope_args=(--scenarios-dir="/workspace/$scenarios_dir")
        else
          scope_args=(--scenarios-root=/workspace)
        fi

        # An explicit `if` rather than `[ -n … ] && …`: under `set -e` a short-circuiting AND-OR
        # list is only exempt while it is not the last statement, so the terse form is safe here
        # by position alone and would fail silently if anything were ever appended after it.
        only_args=()
        if [ -n "$KERNO_SCENARIOS" ]; then
          only_args=(--only="$KERNO_SCENARIOS")
          scope_args+=("${only_args[@]}")
        fi

        # Suite name for one application's report file. The runner uses the directory's own name
        # when it is unique and the path otherwise, and calls the repository root `root`.
        suite_name() {
          local dir="$1"
          local base other other_base count
          if [ "$dir" = "." ]; then
            base=root
          else
            base="${dir##*/}"
          fi
          count=0
          for other in "${app_dirs[@]}"; do
            if [ "$other" = "." ]; then
              other_base=root
            else
              other_base="${other##*/}"
            fi
            if [ "$other_base" = "$base" ]; then
              count=$((count + 1))
            fi
          done
          if [ "$count" -le 1 ]; then
            printf '%s' "$base"
            return
          fi
          if [ "$dir" = "." ]; then
            printf 'root'
            return
          fi
          printf '%s' "${dir//\//-}"
        }

        # A cancelled run leaves the container behind; the next run would then fail on the name
        # conflict while still copying the PREVIOUS run's reports out — a stale pass.
        docker rm -f kerno-check-run >/dev/null 2>&1 || true

        # Copied out rather than bind-mounted: a directory created in the same step that mounts it
        # does not reliably receive the container's writes.
        report_dir=$(mktemp -d)
        replay_exit=0

        if [ "$includes_root" = 1 ]; then
          # One container per application. Discovery cannot see a sibling of the repository-root
          # app, and --app=. does not match the empty key discovery uses for that app, so no
          # single replay invocation can carry both URLs. --scenarios-dir is how this runner
          # already replays the root on its own.
          mkdir -p "$report_dir/junit"
          : > "$report_dir/summary.md"
          capture_manifest=$(mktemp)
          : > "$capture_manifest"
          for i in "${!app_dirs[@]}"; do
            dir="${app_dirs[$i]}"
            url="${app_urls[$i]}"
            if [ "$dir" = "." ]; then
              scenarios_dir="/workspace/.kerno/scenarios"
              content_root=""
            else
              scenarios_dir="/workspace/${dir}/.kerno/scenarios"
              content_root="$dir"
            fi
            suite="$(suite_name "$dir")"
            echo "replaying ${dir} against ${url}"

            set +e
            docker run --name kerno-check-run \
              --add-host=host.docker.internal:host-gateway \
              --cap-add=NET_ADMIN \
              "${env_args[@]+"${env_args[@]}"}" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              "$KERNO_IMAGE" replay \
                --scenarios-dir="$scenarios_dir" \
                --sut-base-url="$url" \
                --suite-name="$suite" \
                "${only_args[@]+"${only_args[@]}"}" \
                --junit-dir=/out/junit \
                --summary=/out/summary.md
            code=$?
            set -e
            if [ "$code" -gt "$replay_exit" ]; then
              replay_exit=$code
            fi

            piece=$(mktemp -d)
            if docker cp kerno-check-run:/out/. "$piece/"; then
              if [ -d "$piece/junit" ]; then
                while IFS= read -r report; do
                  cp "$report" "$report_dir/junit/"
                done < <(find "$piece/junit" -maxdepth 1 -type f -name '*.xml' | sort)
                if [ -f "$piece/junit/run-report.json" ]; then
                  cp "$piece/junit/run-report.json" "$report_dir/capture-${i}.json"
                  python3 -c 'import json,sys; print(json.dumps({"contentRoot": sys.argv[1], "path": sys.argv[2]}))' \
                    "$content_root" "$report_dir/capture-${i}.json" >> "$capture_manifest"
                fi
              fi
              if [ -f "$piece/summary.md" ]; then
                cat "$piece/summary.md" >> "$report_dir/summary.md"
              fi
            else
              echo "::warning::the run for ${dir} produced no reports"
            fi
            rm -rf "$piece"
            docker rm -f kerno-check-run >/dev/null 2>&1 || true
          done
          if [ -s "$capture_manifest" ]; then
            python3 "$GITHUB_ACTION_PATH/captures.py" "$report_dir/junit/run-report.json" < "$capture_manifest"
          fi
          rm -f "$capture_manifest"
        else
          set +e
          # --sut-base-url is omitted entirely when apps carries the URLs: the driver rejects an
          # --app mapping combined with a blank base URL, and passing an empty string would look
          # like a configured-but-empty URL rather than "not set".
          url_args=()
          if [ -n "$sut_url" ]; then
            url_args=(--sut-base-url="$sut_url")
          fi

          # The driver writes one report per application and refuses --junit for more than one, and
          # how many there are is only known after discovery has run INSIDE the container — so no
          # combination of inputs can pick the flag correctly. Always ask for a directory, and decide
          # report-path's shape below from what actually came back.
          junit_args=(--junit-dir=/out/junit)

          docker run --name kerno-check-run \
            --add-host=host.docker.internal:host-gateway \
            --cap-add=NET_ADMIN \
            "${env_args[@]+"${env_args[@]}"}" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            "$KERNO_IMAGE" replay \
              "${scope_args[@]}" \
              "${app_args[@]+"${app_args[@]}"}" \
              "${url_args[@]+"${url_args[@]}"}" \
              "${junit_args[@]}" \
              --summary=/out/summary.md
          replay_exit=$?
          set -e

          docker cp kerno-check-run:/out/. "$report_dir/" || echo "::warning::the run produced no reports"
          docker rm -f kerno-check-run >/dev/null 2>&1 || true
        fi

        # report-path keeps the shape it has always had: a file when one application was replayed,
        # the directory of per-application reports when several were. `apps` names its applications
        # up front and has always produced a directory, so it stays one even at a single app.
        reports=()
        if [ -d "$report_dir/junit" ]; then
          while IFS= read -r report; do
            reports+=("$report")
          done < <(find "$report_dir/junit" -maxdepth 1 -type f -name '*.xml' | sort)
        fi

        if [ "${#reports[@]}" -eq 1 ] && [ "$separate_apps" != 1 ]; then
          mkdir -p "$(dirname "$GITHUB_WORKSPACE/$KERNO_REPORT_PATH")"
          cp "${reports[0]}" "$GITHUB_WORKSPACE/$KERNO_REPORT_PATH"
          echo "junit-path=$KERNO_REPORT_PATH" >> "$GITHUB_OUTPUT"
        elif [ "${#reports[@]}" -gt 0 ]; then
          mkdir -p "$GITHUB_WORKSPACE/$KERNO_REPORT_PATH"
          cp "$report_dir/junit/." "$GITHUB_WORKSPACE/$KERNO_REPORT_PATH" -r
          echo "junit-path=$KERNO_REPORT_PATH" >> "$GITHUB_OUTPUT"
        else
          echo "junit-path=" >> "$GITHUB_OUTPUT"
        fi

        # The portal payload is the runner's HTTP capture, written next to the JUnit reports.
        # Copied to a stable workspace path so the report step does not have to care whether
        # report-path ended up a file or a directory.
        capture=""
        if [ -f "$report_dir/junit/run-report.json" ]; then
          capture="$GITHUB_WORKSPACE/kerno-run-report.json"
          cp "$report_dir/junit/run-report.json" "$capture"
        fi
        echo "capture-path=$capture" >> "$GITHUB_OUTPUT"

        # The container cannot write to $GITHUB_STEP_SUMMARY — that path belongs to the runner.
        if [ -f "$report_dir/summary.md" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cat "$report_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "replay-exit=$replay_exit" >> "$GITHUB_OUTPUT"

    - name: Read the report
      id: report
      if: ${{ inputs.mode == 'replay' }}
      shell: bash
      env:
        KERNO_JUNIT_PATH: ${{ steps.replay.outputs.junit-path }}
        KERNO_CAPTURE_PATH: ${{ steps.replay.outputs.capture-path }}
        KERNO_REPLAY_EXIT: ${{ steps.replay.outputs.replay-exit }}
        KERNO_FAIL_ON_FAILURE: ${{ inputs.fail-on-failure }}
        KERNO_API_KEY: ${{ inputs.api-key }}
        KERNO_ORGANIZATION_ID: ${{ inputs.organization-id }}
        KERNO_EVENTS_URL: ${{ inputs.events-url }}
        KERNO_BACKEND_URL: ${{ inputs.backend-url }}
        KERNO_PORTAL_URL: ${{ inputs.portal-url }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/report.py"

    - name: Sync the .kerno snapshot
      if: ${{ inputs.mode == 'sync' }}
      shell: bash
      env:
        KERNO_API_KEY: ${{ inputs.api-key }}
        KERNO_ORGANIZATION_ID: ${{ inputs.organization-id }}
        KERNO_EVENTS_URL: ${{ inputs.events-url }}
        KERNO_BACKEND_URL: ${{ inputs.backend-url }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/sync.py"
