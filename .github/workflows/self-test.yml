# Runs this action against a system under test, in this repository, on every change to it.
#
# Customers pin `uses: kernoio/kerno-check@v1` in their own workflows, so a regression here lands
# in their PR checks rather than ours. This is the only place that catches it first.
#
# The fixture is deliberately mixed: one scenario passes, one is a stub. Asserting the stub is
# reported SKIPPED is the load-bearing part — a fixture where everything passes would still look
# green if the action started miscounting, which is precisely the failure being guarded against.
name: self-test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Callable so the release workflow can prove the TAGGED commit works, not just the branch.
  workflow_call:

# Declared rather than inherited, so being called from release.yml cannot widen it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, no Docker: a released version must never carry a floating image reference.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The image must be pinned by digest
        run: python3 .github/scripts/verify_image_pin.py

  self-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Stands in for the customer's application. Any HTTP service would do; the fixture's
      # scenarios only assert on `GET /`, and the runner image happens to serve that.
      - name: Start the system under test
        run: |
          docker run -d --name self-test-sut -p 8080:9876 \
            kernoio/ts-sandbox@sha256:0f5d2c152dcfd1ad0ceb5dbbf42b6b966de03d3a3d869c4f48f3a3d03eac74d1
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null http://localhost:8080/; then echo "SUT ready"; exit 0; fi
            sleep 2
          done
          echo "the system under test never became ready" >&2
          docker logs self-test-sut 2>&1 | tail -30 >&2
          exit 1

      # localhost on purpose: it is what a customer writes, and exercises the rewrite to
      # host.docker.internal that the action performs.
      - name: Run the action
        id: kerno
        uses: ./
        with:
          sut-url: http://localhost:8080
          app-dir: test-fixture
          report-path: reports/kerno-junit.xml

      - name: Assert the action reported the fixture correctly
        if: ${{ always() }}
        env:
          TOTAL: ${{ steps.kerno.outputs.total }}
          PASSED: ${{ steps.kerno.outputs.passed }}
          FAILED: ${{ steps.kerno.outputs.failed }}
          SKIPPED: ${{ steps.kerno.outputs.skipped }}
          JUNIT: ${{ steps.kerno.outputs.junit-path }}
        run: |
          set -euo pipefail
          echo "outputs: total=$TOTAL passed=$PASSED failed=$FAILED skipped=$SKIPPED junit=$JUNIT"

          problems=()
          [ "$TOTAL" = "2" ]   || problems+=("total was '$TOTAL', expected 2")
          [ "$PASSED" = "1" ]  || problems+=("passed was '$PASSED', expected 1")
          [ "$FAILED" = "0" ]  || problems+=("failed was '$FAILED', expected 0")
          # The one that matters: a stub must never be counted as a pass.
          [ "$SKIPPED" = "1" ] || problems+=("skipped was '$SKIPPED', expected 1 — a stub was miscounted")
          [ "$JUNIT" = "reports/kerno-junit.xml" ] || problems+=("junit-path was '$JUNIT'")
          [ -f reports/kerno-junit.xml ] || problems+=("the report was not written to report-path")

          for problem in "${problems[@]:-}"; do
            [ -n "$problem" ] && echo "::error::$problem"
          done
          [ "${#problems[@]}" -eq 0 ]

      - name: Publish the report
        if: ${{ always() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/kerno-junit.xml
          check_name: self-test scenarios
          detailed_summary: true
          include_passed: true
          require_tests: true
          # The action's own exit code is the gate; do not let the reporter double-fail the job.
          fail_on_failure: false

      - name: System under test logs on failure
        if: ${{ failure() }}
        run: docker logs self-test-sut 2>&1 | tail -60

      - name: Tear down
        if: ${{ always() }}
        run: docker rm -f self-test-sut kerno-check-run 2>/dev/null || true

  # Reporting is opt-in and must never gate the check, so all three behaviours are asserted: the
  # default sends nothing, an enabled run sends rows a portal could attribute, and an ingest that
  # is not listening leaves the step green. The ingest is a local recorder — the contract under
  # test is the request that leaves the runner.
  report-self-test:
    needs: validate
    runs-on: ubuntu-latest
    env:
      CAPTURE: /tmp/captured.jsonl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start the system under test
        run: |
          docker run -d --name report-self-test-sut -p 8080:9876 \
            kernoio/ts-sandbox@sha256:0f5d2c152dcfd1ad0ceb5dbbf42b6b966de03d3a3d869c4f48f3a3d03eac74d1
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null http://localhost:8080/; then echo "SUT ready"; exit 0; fi
            sleep 2
          done
          echo "the system under test never became ready" >&2
          exit 1

      - name: Start the ingest recorder
        run: |
          set -euo pipefail
          : > "$CAPTURE"
          nohup python3 .github/scripts/recorder.py >/tmp/recorder.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' \
                 -d '{}' http://127.0.0.1:9099/warmup; then
              echo "recorder ready"
              : > "$CAPTURE"
              exit 0
            fi
            sleep 1
          done
          echo "the recorder never became ready" >&2
          cat /tmp/recorder.log >&2
          exit 1

      # No Kerno inputs at all: the reporting step must not even run.
      - name: Run the action with reporting off
        uses: ./
        with:
          sut-url: http://localhost:8080
          app-dir: test-fixture
          report-path: reports/off.xml

      - name: Assert the default sent nothing
        run: |
          set -euo pipefail
          if [ -s "$CAPTURE" ]; then
            echo "::error::reporting is opt-in, but the default run sent requests"
            cat "$CAPTURE" >&2
            exit 1
          fi
          echo "no requests, as expected"

      - name: Run the action with reporting on
        uses: ./
        with:
          sut-url: http://localhost:8080
          app-dir: test-fixture
          report-path: reports/on.xml
          kerno-url: http://127.0.0.1:9099
          kerno-org: 11111111-1111-1111-1111-111111111111
          kerno-token: self-test-key

      - name: Assert the reported rows are attributable
        run: python3 .github/scripts/assert_reported.py

      # The gate is the scenario result, never our ingest. Nothing is listening on port 9.
      - name: Assert an unreachable ingest leaves the check green
        uses: ./
        with:
          sut-url: http://localhost:8080
          app-dir: test-fixture
          report-path: reports/dead.xml
          kerno-url: http://127.0.0.1:9
          kerno-org: 11111111-1111-1111-1111-111111111111
          kerno-token: self-test-key

      - name: Recorder log on failure
        if: ${{ failure() }}
        run: cat /tmp/recorder.log || true

      - name: Tear down
        if: ${{ always() }}
        run: |
          pkill -f recorder.py 2>/dev/null || true
          docker rm -f report-self-test-sut kerno-check-run 2>/dev/null || true
